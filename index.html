<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neor — Talk to different AI agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c11;
    --panel:#12151d;
    --panel-2:#171b25;
    --line: rgba(255,255,255,0.08);
    --line-soft: rgba(255,255,255,0.05);
    --text:#eceef3;
    --text-dim:#868da3;
    --text-faint:#565c6e;

    --accent:#5eead4;
    --accent-soft: rgba(94,234,212,0.12);
    --accent-2:#a78bfa;
    --accent-2-soft: rgba(167,139,250,0.12);
    --accent-3:#fb923c;
    --accent-3-soft: rgba(251,146,60,0.12);

    --display: 'Space Grotesk', sans-serif;
    --sans: 'Inter', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* background grid texture */
  .grid-bg{
    position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 40%, transparent 100%);
            mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 40%, transparent 100%);
    opacity:0.7;
  }

  .app{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: 280px 1fr;
    height:100vh;
  }

  /* ---------------- SIDEBAR ---------------- */
  .sidebar{
    border-right:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), var(--bg));
    display:flex; flex-direction:column;
    padding:24px 18px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--display);
    font-weight:600;
    font-size:1.05rem;
    padding:4px 8px 28px;
  }
  .brand .mark{
    width:26px; height:26px; border-radius:8px;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
    animation: spin 6s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .side-label{
    font-size:0.72rem;
    color:var(--text-faint);
    padding:0 8px 10px;
    letter-spacing:0.02em;
  }

  .agent-list{
    display:flex; flex-direction:column; gap:6px;
    position:relative;
    margin-bottom:28px;
  }
  .agent-btn{
    position:relative;
    display:flex; align-items:center; gap:12px;
    padding:12px 12px;
    border-radius:12px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text-dim);
    font-family:var(--sans);
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
    text-align:left;
    width:100%;
    transition:color .2s ease, background .25s ease, border-color .25s ease, transform .15s ease;
  }
  .agent-btn:hover{
    color:var(--text);
    background:rgba(255,255,255,0.035);
    transform:translateX(2px);
  }
  .agent-btn.active{
    color:var(--text);
    background:var(--agent-soft, var(--accent-soft));
    border-color:var(--agent-line, rgba(94,234,212,0.35));
  }
  .agent-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--agent-color, var(--accent));
    box-shadow:0 0 0 0 var(--agent-color, var(--accent));
    flex-shrink:0;
    transition:box-shadow .3s ease;
  }
  .agent-btn.active .agent-dot{
    animation: dotpulse 2s ease-in-out infinite;
  }
  @keyframes dotpulse{
    0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--agent-color, var(--accent)) 55%, transparent); }
    50%{ box-shadow:0 0 0 6px transparent; }
  }
  .agent-meta{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .agent-name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .agent-role{font-size:0.72rem; color:var(--text-faint);}

  .sidebar-footer{
    margin-top:auto;
    padding:14px 12px;
    border-top:1px solid var(--line);
    font-size:0.76rem;
    color:var(--text-faint);
    line-height:1.6;
  }
  .status-live{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .status-live::before{
    content:"";
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px 1px var(--accent);
  }

  .credit{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:0.72rem;
    color:var(--text-faint);
    line-height:1.6;
  }
  .credit .rights{
    color:var(--text-dim);
  }
  .credit a{
    color:var(--agent-color, var(--accent));
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:6px;
    transition: opacity .2s ease;
  }
  .credit a:hover{ opacity:0.75; text-decoration:underline; }
  .credit a svg{ width:13px; height:13px; flex-shrink:0; }

  /* new chat button - animated */
  .new-chat-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    padding:11px;
    margin-bottom:22px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-family:var(--sans);
    font-size:0.86rem;
    font-weight:500;
    cursor:pointer;
    transition: border-color .25s ease, background .25s ease;
  }
  .new-chat-btn:hover{
    border-color: var(--agent-line, rgba(94,234,212,0.4));
    background:var(--panel);
  }
  .new-chat-btn .plus{
    display:inline-block;
    width:14px; height:14px;
    position:relative;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .new-chat-btn .plus::before, .new-chat-btn .plus::after{
    content:"";
    position:absolute; background:var(--text);
  }
  .new-chat-btn .plus::before{ width:14px; height:2px; top:6px; left:0; }
  .new-chat-btn .plus::after{ width:2px; height:14px; top:0; left:6px; }
  .new-chat-btn:hover .plus{ transform:rotate(90deg); }

  /* ---------------- MAIN ---------------- */
  main{
    display:flex; flex-direction:column;
    height:100vh;
    min-width:0;
    position:relative;
    overflow:hidden;
  }

  /* ---------------- BACKGROUND ROAD TEXT ---------------- */
  .road-wrap{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .road-text{
    position:absolute;
    top:50%;
    left:0;
    white-space:nowrap;
    font-family:var(--display);
    font-weight:700;
    font-size:min(24vw, 300px);
    letter-spacing:-0.02em;
    line-height:1;
    background:linear-gradient(90deg,
      transparent 0%,
      var(--agent-color, var(--accent)) 30%,
      var(--agent-color, var(--accent)) 70%,
      transparent 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0.16;
    filter:drop-shadow(0 0 60px var(--agent-color, var(--accent)));
    transform:translate(-100%, -50%);
    animation: roadSlide 16s linear infinite;
    transition: filter .4s ease;
  }
  @keyframes roadSlide{
    0%{ transform:translate(-100%, -50%); }
    100%{ transform:translate(calc(100vw + 100%), -50%); }
  }
  @media (prefers-reduced-motion: reduce){
    .road-text{ animation:none; left:8%; transform:translate(0,-50%); }
  }

  .chat-header, .messages, .input-bar{
    position:relative;
    z-index:1;
  }
  .chat-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .chat-header-agent{ display:flex; align-items:center; gap:14px; }
  .avatar-ring{
    width:38px; height:38px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    background:var(--agent-soft, var(--accent-soft));
    border:1px solid var(--agent-line, rgba(94,234,212,0.35));
    color:var(--agent-color, var(--accent));
    font-family:var(--display); font-weight:600; font-size:0.95rem;
    transition: background .3s ease, border-color .3s ease, color .3s ease;
  }
  .chat-header h1{
    font-family:var(--display);
    font-weight:600;
    font-size:1.08rem;
  }
  .chat-header .sub{ font-size:0.8rem; color:var(--text-faint); margin-top:1px; }

  .clear-btn{
    background:transparent; border:1px solid var(--line);
    color:var(--text-dim); font-size:0.82rem;
    padding:8px 16px; border-radius:100px;
    cursor:pointer;
    transition: border-color .2s, color .2s;
  }
  .clear-btn:hover{ border-color:var(--text-dim); color:var(--text); }

  .messages{
    flex:1;
    overflow-y:auto;
    padding:36px 32px;
    display:flex; flex-direction:column; gap:22px;
  }
  .messages::-webkit-scrollbar{ width:8px; }
  .messages::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  .empty-state{
    margin:auto;
    text-align:center;
    max-width:420px;
    color:var(--text-faint);
  }
  .empty-state .glyph{
    width:56px; height:56px; margin:0 auto 20px;
    border-radius:16px;
    background:var(--agent-soft, var(--accent-soft));
    border:1px solid var(--agent-line, rgba(94,234,212,0.35));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-size:1.4rem; font-weight:600;
    color:var(--agent-color, var(--accent));
  }
  .empty-state h2{
    font-family:var(--display); font-weight:600; font-size:1.15rem;
    color:var(--text); margin-bottom:8px;
  }
  .empty-state p{ font-size:0.88rem; line-height:1.6; }

  .suggestions{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-top:20px;
  }
  .suggestion-chip{
    font-size:0.78rem;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:100px;
    cursor:pointer;
    background:var(--panel-2);
    transition:border-color .2s, color .2s, transform .15s;
  }
  .suggestion-chip:hover{
    border-color:var(--agent-line, rgba(94,234,212,0.4));
    color:var(--text);
    transform:translateY(-1px);
  }

  .msg-row{ display:flex; gap:12px; max-width:78%; }
  .msg-row.user{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-row .bubble-avatar{
    width:30px; height:30px; border-radius:9px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-size:0.78rem; font-weight:600;
  }
  .msg-row.agent .bubble-avatar{
    background:var(--agent-soft, var(--accent-soft));
    border:1px solid var(--agent-line, rgba(94,234,212,0.35));
    color:var(--agent-color, var(--accent));
  }
  .msg-row.user .bubble-avatar{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-dim);
  }
  .bubble{
    padding:13px 16px;
    border-radius:14px;
    font-size:0.92rem;
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg-row.agent .bubble{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-top-left-radius:4px;
  }
  .msg-row.user .bubble{
    background:var(--agent-soft, var(--accent-soft));
    border:1px solid var(--agent-line, rgba(94,234,212,0.3));
    border-top-right-radius:4px;
    color:var(--text);
  }

  .typing{
    display:flex; gap:4px; padding:6px 2px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--agent-color, var(--accent));
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:0.5; }
    30%{ transform:translateY(-5px); opacity:1; }
  }

  .error-note{
    align-self:center;
    font-size:0.8rem;
    color:var(--accent-3);
    background:var(--accent-3-soft);
    border:1px solid rgba(251,146,60,0.3);
    padding:10px 16px;
    border-radius:10px;
    max-width:520px;
    text-align:center;
  }

  /* ---------------- INPUT BAR ---------------- */
  .input-bar{
    padding:20px 32px 26px;
    border-top:1px solid var(--line);
    flex-shrink:0;
  }
  .input-shell{
    display:flex; align-items:flex-end; gap:12px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:18px;
    padding:8px 8px 8px 18px;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  .input-shell:focus-within{
    border-color: var(--agent-line, rgba(94,234,212,0.4));
    box-shadow: 0 0 0 3px var(--agent-soft, var(--accent-soft));
  }
  textarea{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:var(--sans);
    font-size:0.92rem;
    line-height:1.5;
    padding:9px 0;
    max-height:160px;
  }
  textarea::placeholder{ color:var(--text-faint); }

  .send-btn{
    width:42px; height:42px;
    border-radius:13px;
    border:none;
    background:var(--agent-color, var(--accent));
    color:var(--bg);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    position:relative;
    transition: background .3s ease, transform .15s ease;
  }
  .send-btn:hover:not(:disabled){ transform:scale(1.06) rotate(-4deg); }
  .send-btn:active:not(:disabled){ transform:scale(0.94); }
  .send-btn:disabled{ opacity:0.4; cursor:default; }
  .send-btn svg{ width:18px; height:18px; transition:transform .3s ease; }

  .send-btn.loading svg{ display:none; }
  .send-btn .spinner{
    display:none;
    width:16px; height:16px;
    border:2px solid rgba(10,12,17,0.35);
    border-top-color:var(--bg);
    border-radius:50%;
  }
  .send-btn.loading .spinner{
    display:block;
    animation: spin 0.7s linear infinite;
  }

  .input-hint{
    font-size:0.72rem; color:var(--text-faint);
    margin-top:10px; padding-left:6px;
  }

  @media (max-width: 760px){
    .app{ grid-template-columns:1fr; }
    .sidebar{ display:none; }
    .messages, .chat-header, .input-bar{ padding-left:18px; padding-right:18px; }
    .msg-row{ max-width:90%; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="mark"></span>Neor</div>

    <button class="new-chat-btn" id="newChatBtn">
      <span class="plus"></span> New conversation
    </button>

    <div class="side-label">Agents</div>
    <div class="agent-list" id="agentList"></div>

    <div class="sidebar-footer">
      <div class="status-live">Connected</div>
      Each agent keeps its own thread. Switch anytime — nothing is lost.
      <div class="credit">
        <span class="rights">This website was created by Mohammad Mehdi Sadeghi. All rights reserved © 2026.</span>
        <a href="https://github.com/Mohammad-Mehdi-Sadeghi" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.75 5.48.75 11.75c0 5.02 3.26 9.28 7.78 10.78.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.1-3.17.69-3.84-1.35-3.84-1.35-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.33.95.1-.74.4-1.25.72-1.54-2.53-.29-5.19-1.27-5.19-5.63 0-1.24.44-2.26 1.17-3.06-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.14 1.17a10.9 10.9 0 0 1 5.72 0c2.18-1.48 3.14-1.17 3.14-1.17.62 1.57.23 2.73.11 3.02.73.8 1.17 1.82 1.17 3.06 0 4.37-2.67 5.34-5.21 5.62.41.36.77 1.06.77 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.2.66.79.55 4.51-1.51 7.77-5.76 7.77-10.78C23.25 5.48 18.27.5 12 .5Z"/></svg>
          github.com/Mohammad-Mehdi-Sadeghi
        </a>
      </div>
    </div>
  </aside>

  <main>
    <div class="road-wrap" aria-hidden="true">
      <span class="road-text" id="roadText">NEOR</span>
    </div>
    <div class="chat-header">
      <div class="chat-header-agent">
        <div class="avatar-ring" id="headerAvatar">N</div>
        <div>
          <h1 id="headerName">Neor</h1>
          <div class="sub" id="headerRole">General reasoning</div>
        </div>
      </div>
      <button class="clear-btn" id="clearBtn">Clear thread</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <div class="input-shell">
        <textarea id="input" placeholder="Message this agent…" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
          <span class="spinner"></span>
        </button>
      </div>
      <div class="input-hint">Enter to send · Shift + Enter for a new line</div>
    </div>
  </main>
</div>

<script>
// ⚙️ SETUP: get a free key at console.groq.com → API Keys → Create API Key, then paste it below.
// Note: this key is visible to anyone who views this file's source — fine for personal/small
// sharing, but don't post this file publicly if you'd rather keep the key private.
const GROQ_API_KEY = "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";

const AGENTS = [
  {
    id: 'nova',
    name: 'Neor',
    role: 'General reasoning',
    initial: 'N',
    color: '#5eead4',
    soft: 'rgba(94,234,212,0.12)',
    line: 'rgba(94,234,212,0.35)',
    system: 'You are Neor, an advanced general-purpose reasoning assistant. For anything non-trivial, work through the problem carefully step by step before giving your final answer: break it into parts, check your own reasoning for gaps or mistakes, and consider more than one angle before settling on a conclusion. Favor depth and correctness over speed — it is better to reason thoroughly than to answer fast. Once you have reasoned it through, give a clear, well-organized final answer in plain language, free of unnecessary jargon or hedging.',
    suggestions: ['Explain quantum entanglement simply', 'Help me plan my week', 'What should I read next?']
  },
  {
    id: 'atlas',
    name: 'Atlas',
    role: 'Technical & code',
    initial: 'A',
    color: '#a78bfa',
    soft: 'rgba(167,139,250,0.12)',
    line: 'rgba(167,139,250,0.35)',
    system: 'You are Atlas, a rigorous senior-level technical assistant specialized in code, architecture, and engineering problems. Before answering, silently reason through the approach, alternatives, and likely edge cases, then give correct, efficient code with brief but precise explanations. Proactively flag edge cases, performance trade-offs, and failure modes a less careful engineer would miss. Prefer showing working code over describing it, and double-check logic for bugs before presenting it as final.',
    suggestions: ['Write a binary search in Python', 'Explain REST vs GraphQL', 'Debug this: off-by-one loop']
  },
  {
    id: 'ember',
    name: 'Ember',
    role: 'Creative writing',
    initial: 'E',
    color: '#fb923c',
    soft: 'rgba(251,146,60,0.12)',
    line: 'rgba(251,146,60,0.35)',
    system: 'You are Ember, an imaginative, highly skilled creative-writing collaborator. Think about structure, voice, and imagery before writing, not just the first idea that comes to mind — aim for the version of the piece that a widely admired author would actually publish, not a rough first draft. Write with vivid, specific, non-clichéd imagery and a warm, expressive voice. Take creative risks, suggest interesting directions, and help with poems, stories, and voice/tone. Keep a playful, encouraging spirit.',
    suggestions: ['Write a 6-line poem about rain', 'Give me a short story opener', 'Brainstorm names for a sci-fi city']
  }
];

const state = {};
AGENTS.forEach(a => state[a.id] = { history: [] });
let currentAgent = AGENTS[0].id;
let isLoading = false;

const agentList = document.getElementById('agentList');
const messagesEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const headerAvatar = document.getElementById('headerAvatar');
const headerName = document.getElementById('headerName');
const headerRole = document.getElementById('headerRole');
const clearBtn = document.getElementById('clearBtn');
const newChatBtn = document.getElementById('newChatBtn');

function getAgent(id){ return AGENTS.find(a => a.id === id); }

function applyTheme(agent){
  document.documentElement.style.setProperty('--agent-color', agent.color);
  document.documentElement.style.setProperty('--agent-soft', agent.soft);
  document.documentElement.style.setProperty('--agent-line', agent.line);
  headerAvatar.textContent = agent.initial;
  headerName.textContent = agent.name;
  headerRole.textContent = agent.role;
}

function renderAgentList(){
  agentList.innerHTML = '';
  AGENTS.forEach(agent => {
    const btn = document.createElement('button');
    btn.className = 'agent-btn' + (agent.id === currentAgent ? ' active' : '');
    btn.style.setProperty('--agent-color', agent.color);
    btn.style.setProperty('--agent-soft', agent.soft);
    btn.style.setProperty('--agent-line', agent.line);
    btn.innerHTML = `
      <span class="agent-dot"></span>
      <span class="agent-meta">
        <span class="agent-name">${agent.name}</span>
        <span class="agent-role">${agent.role}</span>
      </span>
    `;
    btn.addEventListener('click', () => switchAgent(agent.id));
    agentList.appendChild(btn);
  });
}

function switchAgent(id){
  currentAgent = id;
  applyTheme(getAgent(id));
  renderAgentList();
  renderMessages();
  input.focus();
}

function renderMessages(){
  const agent = getAgent(currentAgent);
  const hist = state[currentAgent].history;
  messagesEl.innerHTML = '';

  if(hist.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `
      <div class="glyph">${agent.initial}</div>
      <h2>Talking to ${agent.name}</h2>
      <p>${agent.system.split('.')[0]}.</p>
      <div class="suggestions">
        ${agent.suggestions.map(s => `<span class="suggestion-chip">${s}</span>`).join('')}
      </div>
    `;
    messagesEl.appendChild(empty);
    empty.querySelectorAll('.suggestion-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        input.value = chip.textContent;
        autosize();
        input.focus();
      });
    });
    return;
  }

  hist.forEach(m => {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (m.role === 'user' ? 'user' : 'agent');
    const avatar = m.role === 'user' ? 'You' : agent.initial;
    row.innerHTML = `
      <div class="bubble-avatar">${avatar}</div>
      <div class="bubble"></div>
    `;
    row.querySelector('.bubble').textContent = m.content;
    messagesEl.appendChild(row);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTypingIndicator(){
  const agent = getAgent(currentAgent);
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.id = 'typingRow';
  row.innerHTML = `
    <div class="bubble-avatar">${agent.initial}</div>
    <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTypingIndicator(){
  const row = document.getElementById('typingRow');
  if(row) row.remove();
}

function autosize(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  sendBtn.disabled = input.value.trim().length === 0 || isLoading;
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text || isLoading) return;

  const agent = getAgent(currentAgent);
  state[currentAgent].history.push({ role: 'user', content: text });
  input.value = '';
  autosize();
  renderMessages();

  isLoading = true;
  sendBtn.disabled = true;
  sendBtn.classList.add('loading');
  addTypingIndicator();

  try{
    const apiMessages = state[currentAgent].history.map(m => ({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: m.content
    }));

    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: 'openai/gpt-oss-120b',
        max_tokens: 2000,
        messages: [{ role: 'system', content: agent.system }, ...apiMessages]
      })
    });

    const data = await response.json();
    removeTypingIndicator();

    if(data && data.choices && data.choices[0]){
      const reply = data.choices[0].message?.content || '(no response)';
      state[currentAgent].history.push({ role: 'assistant', content: reply });
      renderMessages();
    } else if (data && data.error) {
      throw new Error(data.error.message || 'API error');
    } else {
      throw new Error('Malformed response');
    }
  } catch(err){
    removeTypingIndicator();
    const errRow = document.createElement('div');
    errRow.className = 'error-note';
    errRow.textContent = "Couldn't reach " + agent.name + ": " + (err.message || "please try again.");
    messagesEl.appendChild(errRow);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  } finally {
    isLoading = false;
    sendBtn.classList.remove('loading');
    sendBtn.disabled = input.value.trim().length === 0;
  }
}

input.addEventListener('input', autosize);
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

clearBtn.addEventListener('click', () => {
  state[currentAgent].history = [];
  renderMessages();
});

newChatBtn.addEventListener('click', () => {
  AGENTS.forEach(a => state[a.id].history = []);
  renderMessages();
});

renderAgentList();
applyTheme(getAgent(currentAgent));
renderMessages();
autosize();
</script>

</body>
</html>
